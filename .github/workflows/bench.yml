# SPDX-License-Identifier: Apache-2.0
# SANKHYA - benchmark runs on a GitHub-hosted runner, dispatched by hand.
#
# WHY. The team laptop runs many sessions at a 1-minute load of 12 to 18, so every timed or
# time-limited run there is contaminated (#1023: pilot87 hit 120 s, which it solves in 22 s
# alone). This job builds the exact ref from a clean checkout, so the stamp the runner reads
# from the binary is not -dirty, runs the existing runner in bench/runners/ and uploads the
# CSV(s) and the run log as an artifact. It changes nothing in the repository.
#
# A GitHub-hosted runner is a shared VM: its timings are indicative, the counts (optimal,
# verified, certified) are the headline. The machine tag names the runner, its vCPUs, CPU
# model and RAM, read from lscpu and free on the box.
#
# Committing a result goes through a pull request like any other change:
#
#   gh run download <run-id> -R thegoodengineers/SANKHYA -D /tmp/bench
#   cp /tmp/bench/bench-*/results/* bench/results/
#   python bench/runners/make_benchmarks_doc.py   # and the other generators the CSV feeds
#
# `options` is appended to the runner's command line, split on spaces, e.g.
# `--solver-option presolve=off` or, for ab-netlib, `--new-option engine_race=true --repeats 5`.
# ab-supernodal (#470) runs bench/runners/supernodal_ab.py's four IPM arms over base_ref and ref.
# pdhg-step-weight-ab (#482) runs bench/runners/pdhg_step_weight_ab.py on one binary, e.g.
# `--data-dir data/netlib --instances all --scheme averaged --seeds 0 --iteration-limit 100000`
# (data/kennington and data/refinery work the same way).
# decomposition (#525, #1048) runs bench/runners/decomposition.py over the refinery ladder.

name: bench

on:
  workflow_dispatch:
    inputs:
      suite:
        description: which runner
        type: choice
        options:
          - netlib-full
          - netlib-certified
          - maros-meszaros
          - head-to-head-maros-meszaros
          - head-to-head-netlib
          - head-to-head-miplib3
          - head-to-head-stress
          - pooling
          - pooling-certified
          - qplib-qcqp
          - kennington
          - miplib-tier1
          - miplib3
          - miplib2017-bench
          - first-incumbent
          - refinery
          - head-to-head-refinery-qp
          - ab-netlib
          - ab-supernodal
          - mittelmann
          - lpfeas14
          - pdhg-step-weight-ab
          - rolling-warm-start
          - structural-warm-start
          - ab-option
          - decomposition
          - fj-share-refinery
          - fj-share-miplib
          - profile-nodes
        required: true
      ref:
        description: commit (short or full sha), branch or tag to build and run (ab-* - the new arm)
        default: main
        required: true
      base_ref:
        description: ab-* only - the base arm
        default: main
        required: false
      time_limit:
        description: seconds per solve (empty - the runner's default)
        default: ""
        required: false
      options:
        description: extra arguments for the runner
        default: ""
        required: false

permissions:
  contents: read

jobs:
  bench:
    name: ${{ inputs.suite }} at ${{ inputs.ref }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      SUITE: ${{ inputs.suite }}
      TIME_LIMIT: ${{ inputs.time_limit }}
      OPTIONS: ${{ inputs.options }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # actions/checkout takes a branch, a tag or a full sha, and fails on a short sha (four
      # dispatched runs died that way). Every ref is resolved here, against the full history,
      # so a short sha works too; the base arm is a worktree at its own resolved commit.
      - name: Check out the ref, and the base arm
        env:
          REF: ${{ inputs.ref }}
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          set -euo pipefail
          resolve() {
            git rev-parse --verify --quiet "origin/$1^{commit}"               || git rev-parse --verify "$1^{commit}"
          }
          new="$(resolve "$REF")"
          git checkout -q --detach "$new"
          echo "ref      $REF -> $new"
          if [[ "$SUITE" == ab-* ]]; then
            base="$(resolve "$BASE_REF")"
            git worktree add -q --detach .base "$base"
            echo "base_ref $BASE_REF -> $base"
          fi

      # MIPLIB tier 1 from the runner cache, keyed on the committed manifest: fetch_miplib.py
      # then checks each file's sha256 and downloads nothing, so a miplib.zib.de outage only
      # matters to a cold cache.
      - name: Cache the MIPLIB tier-1 instances
        uses: actions/cache@v4
        with:
          path: data/miplib/*.mps.gz
          key: miplib-tier1-${{ hashFiles('bench/runners/miplib_tier1.json') }}

      - name: Install toolchain
        run: |
          scripts/ci_apt.sh ninja-build zlib1g-dev

      # HiGHS and SCIP are rivals in the refinery head-to-head, run as separate processes
      # (bench/runners/rivals.py); nothing here is linked into SANKHYA.
      - name: Install the refinery rivals
        if: inputs.suite == 'refinery' || inputs.suite == 'head-to-head-refinery-qp'
        run: pip install numpy highspy pyscipopt

      # #1158: callgrind for the per-node cost profile; it counts instructions, so the shares
      # do not depend on the runner's speed or on what else it is doing.
      - name: Install valgrind for the node profile
        if: inputs.suite == 'profile-nodes'
        run: scripts/ci_apt.sh valgrind

      # #1158: HiGHS beside SANKHYA on the same 65 MIPLIB 3 models, same job, same machine.
      - name: Install HiGHS for the MIPLIB 3 head-to-head
        if: inputs.suite == 'miplib3' || inputs.suite == 'miplib2017-bench' || inputs.suite == 'first-incumbent'
        run: pip install numpy highspy

      # #983: the Maros-Meszaros head-to-head runs every rival compare_suite.py knows - HiGHS,
      # SCIP, Clp and GLPK, and the convex QP solvers OSQP, Clarabel, PIQP and SCS (PROVENANCE
      # judgement call 40) - each a separate process; nothing here is linked into SANKHYA.
      - name: Install the Maros-Meszaros rivals
        if: inputs.suite == 'head-to-head-maros-meszaros'
        run: |
          sudo apt-get install -y coinor-clp glpk-utils
          pip install numpy scipy highspy pyscipopt osqp clarabel piqp scs
          pip list 2>/dev/null | grep -iE 'highspy|pyscipopt|osqp|clarabel|piqp|scs'

      # The four open-source solvers the problem statement names - HiGHS, SCIP, CBC (with its
      # LP engine Clp) and GLPK - as released packages, each run as a separate process
      # (bench/runners/rivals.py); nothing here is linked into SANKHYA. The versions are
      # printed here and recorded per row in the CSV.
      - name: Install the open-source solvers of the head-to-head
        if: >-
          inputs.suite == 'head-to-head-netlib' || inputs.suite == 'head-to-head-miplib3'
          || inputs.suite == 'head-to-head-stress'
        run: |
          sudo apt-get install -y coinor-clp coinor-cbc glpk-utils
          pip install numpy highspy pyscipopt
          dpkg-query -W coinor-clp coinor-cbc glpk-utils
          pip list 2>/dev/null | grep -iE 'highspy|pyscipopt'

      - name: Build
        run: |
          scripts/configure.sh build Release -DSANKHYA_BUILD_TESTS=OFF
          cmake --build build -j
          build/sankhya version

      - name: Build the base arm
        if: startsWith(inputs.suite, 'ab-')
        working-directory: .base
        run: |
          scripts/configure.sh build Release -DSANKHYA_BUILD_TESTS=OFF
          cmake --build build -j
          build/sankhya version

      - name: Run
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/out"
          mkdir -p "$out/results"
          # bench/runners/rivals.py keeps each clp, cbc and glpsol run's raw output here, so
          # it is uploaded with the CSV.
          export SANKHYA_RIVAL_LOGS="$out/logs"
          cpu="$(lscpu | sed -n 's/^Model name: *//p' | head -1)"
          ram="$(free -g | awk '/^Mem:/ {print $2}')"
          machine="github-actions ubuntu-24.04 $(nproc) vCPU ${cpu} ${ram} GiB RAM"
          sha="$(python3 -c 'import sys; sys.path.insert(0, "bench/runners"); import stamp; print(stamp.binary_commit("build/sankhya"))')"
          echo "machine $machine"
          echo "binary  $sha"
          limit=()
          [ -n "$TIME_LIMIT" ] && limit=(--time-limit "$TIME_LIMIT")
          # shellcheck disable=SC2086  # options are split on spaces on purpose
          set -- $OPTIONS
          case "$SUITE" in
            netlib-full|netlib-certified|ab-netlib|head-to-head-netlib|head-to-head-stress)
              # fetch_data.py parses the published optima out of the live readme, and decodes
              # every instance again on the way. On Linux the decode writes LF where the
              # tracked copies are CRLF (stored byte-for-byte, .gitattributes), which marked
              # 92 files modified and stamped the run -dirty. The tracked files are the ones
              # every committed CSV's sha256 names, so they are put back and solved.
              python3 bench/runners/fetch_data.py --set full --offline-fallback
              git checkout -- 'data/netlib/*.mps' ;;
            maros-meszaros|head-to-head-maros-meszaros)
              python3 bench/runners/fetch_maros_meszaros.py ;;
            # #755: QPLIB's convex QCQPs. The fetch rewrites the tracked manifest from the
            # site, which would stamp the run -dirty; the committed one, whose sha256s the
            # instances were checked against, is put back, as for Netlib above.
            qplib-qcqp)
              python3 bench/runners/fetch_qplib.py --qcqp
              git checkout -- data/qplib/reference_qcqp.json ;;
            kennington) python3 bench/runners/fetch_kennington.py ;;
            miplib-tier1|fj-share-miplib) python3 bench/runners/fetch_miplib.py ;;
            # #1158: the fetch rewrites the tracked manifest; the committed one is put back.
            # The convex-cost refinery QPs: generated here, not committed (the largest is
            # about 120 MB); the generator and its seed are the record and the CSV carries
            # every file's sha256. Untracked, so the -dirty check below is not affected.
            head-to-head-refinery-qp)
              python3 bench/refinery/generate.py --qp ;;
            miplib3|head-to-head-miplib3|profile-nodes)
              python3 bench/runners/fetch_miplib3.py
              git checkout -- data/miplib3/manifest.json ;;
            # #1199: options is the shard, K/N; the fetch writes its names beside the models.
            miplib2017-bench)
              python3 bench/runners/fetch_miplib.py --benchmark --shard "${OPTIONS:-1/1}" ;;
            # The subset of bench/runners/first_incumbent.json: its MIPLIB 2017 models by
            # name, and MIPLIB 3 whole (the manifest put back, as for miplib3).
            first-incumbent)
              python3 - <<'PY' > "$RUNNER_TEMP/first-incumbent-names.txt"
          import json
          subset = json.load(open('bench/runners/first_incumbent.json'))['instances']
          print(' '.join(n for n, e in sorted(subset.items()) if e['set'] == 'miplib2017-bench'))
          PY
              # shellcheck disable=SC2046  # names are split on spaces on purpose
              python3 bench/runners/fetch_miplib.py --benchmark $(cat "$RUNNER_TEMP/first-incumbent-names.txt")
              python3 bench/runners/fetch_miplib3.py
              git checkout -- data/miplib3/manifest.json ;;
            ab-supernodal) python3 bench/runners/fetch_kennington.py cre-a cre-c ken-07 pds-02 ;;
            mittelmann) python3 bench/runners/fetch_mittelmann.py --set small ;;
            lpfeas14) python3 bench/runners/mittelmann_cuopt.py --fetch ;;
            pdhg-step-weight-ab)
              python3 bench/runners/fetch_data.py --set full --offline-fallback
              python3 bench/runners/fetch_kennington.py ;;
            ab-option)
              case "$OPTIONS" in
                *mittelmann_cuopt.py*) python3 bench/runners/mittelmann_cuopt.py --fetch ;;
                *netlib.py*)
                  python3 bench/runners/fetch_data.py --set full --offline-fallback
                  git checkout -- 'data/netlib/*.mps' ;;
                *kennington.py*) python3 bench/runners/fetch_kennington.py ;;
                *maros_meszaros.py*) python3 bench/runners/fetch_maros_meszaros.py ;;
                *mittelmann.py*) python3 bench/runners/fetch_mittelmann.py --set small ;;
                # #1199: an A/B over benchmark-set models; all 240 are fetched, sha256-checked.
                *miplib2017-bench*) python3 bench/runners/fetch_miplib.py --benchmark ;;
                *miplib3*)
                  python3 bench/runners/fetch_miplib3.py
                  git checkout -- data/miplib3/manifest.json ;;
                *miplib.py*) python3 bench/runners/fetch_miplib.py ;;
              esac ;;
          esac
          # The stress set is generated from the Netlib files just fetched and from its own
          # constructions; stress.py refuses a file whose sha256 is not the manifest's.
          if [ "$SUITE" = head-to-head-stress ]; then
            python3 bench/runners/stress_instances.py
          fi
          # The stamp marks a modified tracked file -dirty (the fetchers' manifests aside), and
          # a -dirty CSV is no evidence, so the run stops here rather than produce one.
          dirty="$(git status --porcelain --untracked-files=no -- . ':!data/*/reference.json')"
          if [ -n "$dirty" ]; then echo "tracked files modified before the run:"; echo "$dirty"; exit 1; fi
          {
            case "$SUITE" in
              netlib-full)
                python3 bench/runners/netlib.py --binary build/sankhya --machine "$machine" \
                  ${limit[@]+"${limit[@]}"} "$@" ;;
              netlib-certified)
                python3 bench/runners/netlib.py --binary build/sankhya --machine "$machine" \
                  --out "bench/results/certified-gap-netlib-full-${sha}.csv" \
                  ${limit[@]+"${limit[@]}"} "$@" ;;
              maros-meszaros)
                python3 bench/runners/maros_meszaros.py --binary build/sankhya \
                  --machine "$machine" ${limit[@]+"${limit[@]}"} "$@" ;;
              kennington)
                python3 bench/runners/kennington.py --binary build/sankhya --machine "$machine" \
                  ${limit[@]+"${limit[@]}"} "$@" ;;
              # #755: the conic interior point and the global method on each instance.
              qplib-qcqp)
                python3 bench/runners/qplib_qcqp.py --binary build/sankhya --machine "$machine" \
                  ${limit[@]+"${limit[@]}"} "$@" ;;
              # miplib.py and compare.py build their own tag (CPU, cores, RAM, OS) around
              # the kind given here.
              miplib-tier1)
                python3 bench/runners/miplib.py --binary build/sankhya --tier 1 \
                  --machine-kind "github-actions ubuntu-24.04" ${limit[@]+"${limit[@]}"} "$@" ;;
              # #1158: the classic set, 3 seeds, then HiGHS on the same files in the same
              # job. One thread by construction (the README row's protocol), since the shipped
              # mip_threads is one per core; options go to miplib.py only.
              miplib3)
                python3 bench/runners/miplib.py --binary build/sankhya --set miplib3 --seeds 3 \
                  --threads 1 --machine-kind "github-actions ubuntu-24.04" \
                  ${limit[@]+"${limit[@]}"} "$@"
                python3 bench/runners/compare.py --suite miplib3 --sankhya-binary build/sankhya \
                  --machine-kind "github-actions ubuntu-24.04" ${limit[@]+"${limit[@]}"} ;;
              # #1199: one shard of the 240-model MIPLIB 2017 benchmark set, SANKHYA on one
              # thread then HiGHS on the same files in the same job.
              # options are first_incumbent.py's own: --arm NAME=opt=val[,opt=val] ...
              first-incumbent)
                python3 bench/runners/first_incumbent.py --binary build/sankhya \
                  --machine-kind "github-actions ubuntu-24.04" ${limit[@]+"${limit[@]}"} \
                  --out "bench/results/first-incumbent-${sha}.csv" --logs "$out/logs" "$@" ;;
              miplib2017-bench)
                shard="${OPTIONS:-1/1}"; k="${shard%/*}"; n="${shard#*/}"
                mapfile -t names < "data/miplib2017-bench/shard-${k}-of-${n}.txt"
                tag="${TIME_LIMIT:-60}s-shard${k}of${n}-${sha}"
                python3 bench/runners/miplib.py --binary build/sankhya --set miplib2017-bench \
                  --threads 1 --machine-kind "github-actions ubuntu-24.04" \
                  ${limit[@]+"${limit[@]}"} --instances "${names[@]}" \
                  --out "bench/results/miplib2017-bench-${tag}.csv"
                python3 bench/runners/compare.py --suite miplib2017-bench \
                  --sankhya-binary build/sankhya --machine-kind "github-actions ubuntu-24.04" \
                  ${limit[@]+"${limit[@]}"} --instances "${names[@]}" \
                  --out "bench/results/highs-miplib2017-bench-${tag}.csv" ;;
              # SANKHYA, HiGHS, SCIP, CBC and GLPK in one job, each one thread, graded by the
              # same rule and tools/verify_solution.py: Netlib (120 s), the 65 MIPLIB 3 models
              # (60 s) and the stress set (60 s).
              head-to-head-netlib)
                python3 bench/runners/compare.py --suite netlib --sankhya-binary build/sankhya \
                  --machine-kind "github-actions ubuntu-24.04" ${limit[@]+"${limit[@]}"} "$@" ;;
              head-to-head-miplib3)
                python3 bench/runners/compare.py --suite miplib3-all \
                  --sankhya-binary build/sankhya \
                  --machine-kind "github-actions ubuntu-24.04" ${limit[@]+"${limit[@]}"} "$@" ;;
              head-to-head-stress)
                python3 bench/runners/stress.py --binary build/sankhya --machine "$machine" \
                  --solvers sankhya highs scip cbc-clp glpk ${limit[@]+"${limit[@]}"} "$@" ;;
              head-to-head-maros-meszaros)
                python3 bench/runners/compare.py --suite maros-meszaros                   --sankhya-binary build/sankhya --machine-kind "github-actions ubuntu-24.04"                   ${limit[@]+"${limit[@]}"} "$@" ;;
              # #514: the pooling set (committed in data/pooling), and the same 39 runs with
              # every global bound certificate checked by tools/verify_global_certificate.py.
              pooling)
                python3 bench/runners/pooling.py --binary build/sankhya                   ${limit[@]+"${limit[@]}"} "$@" ;;
              pooling-certified)
                python3 bench/runners/pooling.py --binary build/sankhya --certificate                   ${limit[@]+"${limit[@]}"} "$@" ;;
              refinery)
                python3 bench/runners/compare.py --suite refinery --sankhya-binary build/sankhya \
                  --machine-kind "github-actions ubuntu-24.04" ${limit[@]+"${limit[@]}"} "$@" ;;
              # `--ipm-trace` also runs the default QP engine alone on the 1M instance at
              # log_level=verbose and keeps that log in the artifact (where its time goes).
              head-to-head-refinery-qp)
                trace=0; pass=()
                for a in "$@"; do
                  if [ "$a" = "--ipm-trace" ]; then trace=1; else pass+=("$a"); fi
                done
                python3 bench/runners/compare.py --suite refinery-qp --sankhya-binary build/sankhya \
                  --machine-kind "github-actions ubuntu-24.04" ${limit[@]+"${limit[@]}"} ${pass[@]+"${pass[@]}"}
                if [ "$trace" = 1 ]; then
                  build/sankhya solve data/refinery-qp/refinery_qp_1m.qps --time-limit 600 \
                    --option threads=1 --option log_level=verbose --option profile=detailed \
                    > "$out/ipm-1m-trace.log" 2>&1 || true
                  tail -60 "$out/ipm-1m-trace.log"
                fi ;;
              # #913: options="--algorithm pdhg" for the PDHG warm start. Runs through the
              # Python bindings, which load build/libsankhya; it takes no time limit.
              # One job, one machine, one binary: both arms of an option A/B interleaved
              # per instance (bench/runners/option_ab.py), e.g. options="--runner
              # kennington.py --option ipm_supernodal=true --instances cre-a pds-02".
              ab-option)
                python3 bench/runners/option_ab.py --binary build/sankhya --machine "$machine"                   --out-prefix "bench/results/option-ab-${sha}" ${limit[@]+"${limit[@]}"} "$@" ;;
              rolling-warm-start)
                python3 bench/runners/rolling_warm_start.py --machine "$machine" "$@" ;;
              # #1030: the share of each solve spent in Feasibility Jump, with its objective -
              # the demo blend MILP and the refinery suite MILPs, or MIPLIB tier 1 (seed 0).
              # options take --repeats, --instances, --solver-option KEY=VALUE and --out.
              fj-share-refinery|fj-share-miplib)
                python3 bench/runners/fj_share.py --binary build/sankhya \
                  --set "${SUITE#fj-share-}" --machine-kind "github-actions ubuntu-latest" \
                  --out "bench/results/${SUITE}-${sha}.csv" \
                  ${limit[@]+"${limit[@]}"} "$@" ;;
              # #913: random row and column additions and removals on Netlib models, warm
              # against cold dual-simplex pivots, through the Python bindings.
              structural-warm-start)
                python3 bench/runners/structural_warm_start.py --machine "$machine" "$@" ;;
              ab-netlib)
                base_sha="$(python3 -c 'import sys; sys.path.insert(0, "bench/runners"); import stamp; print(stamp.binary_commit(".base/build/sankhya"))')"
                python3 bench/runners/netlib_ab.py --base .base/build/sankhya \
                  --new build/sankhya --machine "$machine" \
                  --out-prefix "bench/results/ab-netlib-${base_sha}-vs-${sha}" \
                  ${limit[@]+"${limit[@]}"} "$@" ;;
              # #470: scalar and supernodal IPM factorization, 1 and 4 threads, over two refs.
              ab-supernodal)
                python3 bench/runners/supernodal_ab.py --base .base/build/sankhya                   --new build/sankhya --machine "$machine" ${limit[@]+"${limit[@]}"} "$@" ;;
              # The eight smallest Mittelmann LPs; `--instances irish-electricity` narrows it
              # and `--no-highs` skips the HiGHS cross-check (highspy is not installed here).
              mittelmann)
                python3 bench/runners/mittelmann.py --binary build/sankhya \
                  ${limit[@]+"${limit[@]}"} "$@" ;;
              # #1177: Mittelmann's LPfeas-14 on the CPU PDHG engine, ours alone (no card, no
              # cuOpt here), every solve's verbose log kept and its restart trace in the CSV.
              lpfeas14)
                python3 bench/runners/mittelmann_cuopt.py --binary build/sankhya --engine cpu \
                  --skip-cuopt --threads "$(nproc)" --reference-time-limit 0 --card ci \
                  --machine "$machine" --log-dir "$out/logs" ${limit[@]+"${limit[@]}"} "$@" ;;
              # #482: the step and primal-weight legs on one binary.
              pdhg-step-weight-ab)
                python3 bench/runners/pdhg_step_weight_ab.py --binary build/sankhya \
                  --machine "$machine" ${limit[@]+"${limit[@]}"} "$@" ;;
              # #1158: where a branch-and-bound node's instructions go. options: a node
              # limit, then MIPLIB 3 model names, e.g. "20000 mas76 pk1". One thread; the
              # inclusive and the self-cost tables per model go into the artifact. No CSV: a
              # profile is a diagnosis, not a benchmark claim.
              profile-nodes)
                nodes="$1"; shift
                for model in "$@"; do
                  valgrind --tool=callgrind --callgrind-out="$out/callgrind-$model.out"                     build/sankhya solve "data/miplib3/$model.mps" --option mip_threads=1                     --option node_limit="$nodes" --option log_to_console=false                     > "$out/profile-$model.log" 2>&1 || true
                  tail -5 "$out/profile-$model.log"
                  callgrind_annotate --inclusive=yes "$out/callgrind-$model.out"                     | head -150 > "$out/profile-$model-inclusive.txt"
                  callgrind_annotate "$out/callgrind-$model.out"                     | head -150 > "$out/profile-$model-self.txt"
                  head -45 "$out/profile-$model-self.txt"
                done ;;
              # #525, #1048: the refinery ladder, decomposed against monolithic.
              decomposition)
                python3 bench/runners/decomposition.py --binary build/sankhya \
                  --machine "$machine" ${limit[@]+"${limit[@]}"} "$@" ;;
            esac
          } 2>&1 | tee "$out/run.log" || status=$?
          # Every result file the run wrote or rewrote goes into the artifact.
          git status --porcelain --untracked-files=all -- bench/results \
            | awk '{print $2}' | xargs -r -I{} cp {} "$out/results/"
          ls -l "$out/results"
          exit "${status:-0}"

      - name: Upload the results and the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ inputs.suite }}-${{ github.run_id }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: warn
