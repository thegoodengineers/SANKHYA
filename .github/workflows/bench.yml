# SPDX-License-Identifier: Apache-2.0
# SANKHYA - benchmark runs on a GitHub-hosted runner, dispatched by hand.
#
# WHY. The team laptop runs many sessions at a 1-minute load of 12 to 18, so every timed or
# time-limited run there is contaminated (#1023: pilot87 hit 120 s, which it solves in 22 s
# alone). This job builds the exact ref from a clean checkout, so the stamp the runner reads
# from the binary is not -dirty, runs the existing runner in bench/runners/ and uploads the
# CSV(s) and the run log as an artifact. It changes nothing in the repository.
#
# A GitHub-hosted runner is a shared VM: its timings are indicative, the counts (optimal,
# verified, certified) are the headline. The machine tag names the runner, its vCPUs, CPU
# model and RAM, read from lscpu and free on the box.
#
# Committing a result goes through a pull request like any other change:
#
#   gh run download <run-id> -R thegoodengineers/SANKHYA -D /tmp/bench
#   cp /tmp/bench/bench-*/results/* bench/results/
#   python bench/runners/make_benchmarks_doc.py   # and the other generators the CSV feeds
#
# `options` is appended to the runner's command line, split on spaces, e.g.
# `--solver-option presolve=off` or, for ab-netlib, `--new-option engine_race=true --repeats 5`.
# ab-supernodal (#470) runs bench/runners/supernodal_ab.py's four IPM arms over base_ref and ref.
# pdhg-step-weight-ab (#482) runs bench/runners/pdhg_step_weight_ab.py on one binary, e.g.
# `--data-dir data/netlib --instances all --scheme averaged --seeds 0 --iteration-limit 100000`
# (data/kennington and data/refinery work the same way).
# decomposition (#525, #1048) runs bench/runners/decomposition.py over the refinery ladder.

name: bench

on:
  workflow_dispatch:
    inputs:
      suite:
        description: which runner
        type: choice
        options:
          - netlib-full
          - netlib-certified
          - maros-meszaros
          - head-to-head-maros-meszaros
          - head-to-head-netlib
          - head-to-head-miplib3
          - head-to-head-stress
          - pooling
          - pooling-certified
          - qplib-qcqp
          - kennington
          - miplib-tier1
          - miplib3
          - miplib2017-bench
          - first-incumbent
          - refinery
          - head-to-head-refinery-qp
          - ab-netlib
          - ab-supernodal
          - mittelmann
          - lpfeas14
          - pdhg-step-weight-ab
          - rolling-warm-start
          - structural-warm-start
          - ab-option
          - decomposition
          - fj-share-refinery
          - fj-share-miplib
        required: true
      ref:
        description: commit (short or full sha), branch or tag to build and run (ab-* - the new arm)
        default: main
        required: true
      base_ref:
        description: ab-* only - the base arm
        default: main
        required: false
      time_limit:
        description: seconds per solve (empty - the runner's default)
        default: ""
        required: false
      options:
        description: extra arguments for the runner
        default: ""
        required: false

permissions:
  contents: read

jobs:
  bench:
    name: stress bisect ${{ inputs.options }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      OPTIONS: ${{ inputs.options }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install toolchain
        run: |
          scripts/ci_apt.sh ninja-build zlib1g-dev
      - name: Generate the stress set
        run: |
          python3 bench/runners/fetch_data.py --set full --offline-fallback
          git checkout -- 'data/netlib/*.mps'
          python3 bench/runners/stress_instances.py
      # Scratch, never merged: the harness of this branch against a binary built from each
      # commit in `options`, on the four scaled models that had a verdict at d32b3847.
      # Scratch, never merged. `options`: the commits. `time_limit`: empty for the four
      # models through stress.py (the bisect), or a list of stress models to solve directly
      # with the solver's own log kept (why a commit loses a model).
      - name: Build each commit and run the models
        env:
          MODELS: ${{ inputs.time_limit }}
        run: |
          set +e
          set -u
          out="$RUNNER_TEMP/out"; mkdir -p "$out/results"
          echo "out=$out" >> "$GITHUB_ENV"
          cpu="$(lscpu | sed -n 's/^Model name: *//p' | head -1)"
          machine="github-actions ubuntu-24.04 $(nproc) vCPU ${cpu}"
          for spec in $OPTIONS; do
            c="${spec%%:*}"; models="$MODELS"
            case "$spec" in *:*) models="$(echo "${spec#*:}" | tr ',' ' ')" ;; esac
            full="$(git rev-parse --verify "$c^{commit}")" || { echo "BISECT $c unknown"; continue; }
            git worktree add -q --detach ".b/$c" "$full"
            if ! ( cd ".b/$c" && scripts/configure.sh build Release -DSANKHYA_BUILD_TESTS=OFF > "$out/build-$c.log" 2>&1 && cmake --build build -j >> "$out/build-$c.log" 2>&1 ); then
              echo "BISECT $c build failed"; tail -5 "$out/build-$c.log"; continue
            fi
            bin=".b/$c/build/sankhya"
            "$bin" version || true
            if [ -z "$models" ]; then
              python3 bench/runners/stress.py --binary "$bin" --machine "$machine" --solvers sankhya --out "$out/results/stress-bisect-$c.csv" --instances scaled_degen3 scaled_greenbeb scaled_maros-r7 scaled_pilot.we 2>&1 | tee "$out/run-$c.log" | grep -E '^scaled_' | sed "s/^/BISECT $c /"
            else
              for m in $models; do
                log="$out/log-$c-$m.txt"
                start=$(date +%s.%N)
                timeout 200 "$bin" solve "data/stress/$m.mps" --time-limit 60 --option log_level=debug > "$log" 2>&1
                code=$?
                if [ "$(wc -l < "$log")" -lt 5 ]; then
                  timeout 200 "$bin" solve "data/stress/$m.mps" --time-limit 60 > "$log" 2>&1; code=$?
                fi
                end=$(date +%s.%N)
                echo "LOG $c $m exit $code wall $(echo "$end - $start" | bc) lines $(wc -l < "$log")"
                grep -E "^(Result|Presolve|Dual reductions|Scaling|Engine selection|Basis|status|algorithm|iterations|solve seconds|primal infeas|dual infeas)|time by phase|refactorizations|re-solv|tighter|threshold|singular|declined|unsafe|numerical|diverged|restart|fallback|Markowitz|LU " "$log" | cut -c1-330 | sed "s/^/LOG $c $m | /" | head -80
                grep -c "refactorized at iteration" "$log" | sed "s/^/LOG $c $m | refactorized lines: /"
              done
            fi
            rm -rf ".b/$c/build"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress-bisect-${{ github.run_id }}
          path: ${{ env.out }}
