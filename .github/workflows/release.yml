# SPDX-License-Identifier: Apache-2.0
# SANKHYA - release archives and the container image, built by CI alone (#748).
#
# Every leg builds from a clean runner, packages with scripts/package_release.sh (which also
# runs the provenance check on the SHIPPED binaries), then unpacks the archive on a machine
# or container with no compiler and solves and verifies the demo from it. The outputs are
# workflow artifacts. On a v* tag the image is also pushed to
# ghcr.io/thegoodengineers/sankhya:<tag>, and a DRAFT pre-release is created with the
# archives attached and its notes read from .github/release-notes/<tag>.md. Pushing the
# tag is the decision to publish the image; making the release public is a click after it.
#
# What is not built, and why:
#   Windows CUDA: nvcc on Windows requires MSVC as its host compiler, and this tree builds
#   with MinGW-w64 GCC (the -static runtime link in CMakeLists.txt). A CUDA build for Windows
#   needs the tree to build under MSVC first.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/package_release.sh
      - scripts/build_wheel.py
      - scripts/wheel_smoke.py
      - bindings/python/sankhya/**
      - Dockerfile

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-cpu:
    name: Linux x86-64 CPU archive
    # 22.04 rather than latest: the archive runs on glibc 2.35 and every later one.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++
      - name: Build
        # The distribution's GCC 11, as in the CUDA container: GCC 12 reports a -Wrestrict
        # false positive inside libstdc++ under -Werror. libstdc++ and libgcc linked
        # statically, zlib built in (no system zlib is assumed on the target), libgomp
        # shipped beside the binary and found through $ORIGIN.
        run: |
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DSANKHYA_BUILD_TESTS=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_ZLIB=ON \
            "-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc" \
            "-DCMAKE_SHARED_LINKER_FLAGS=-static-libstdc++ -static-libgcc" \
            '-DCMAKE_BUILD_RPATH=$ORIGIN'
          cmake --build build -j
      - name: Package
        run: |
          scripts/package_release.sh build linux-x86_64-cpu dist \
            "$(g++ -print-file-name=libgomp.so.1)"
          ninja -C build -t commands sankhya | tail -1 > dist/link-line-linux-cpu.txt
      - name: Wheel
        # glibc 2.35 is what the binaries need (built here on 22.04, libstdc++ static, libgomp
        # inside the wheel), so manylinux_2_35. auditwheel, PyPA's checker, must agree.
        run: |
          python3 scripts/build_wheel.py build manylinux_2_35_x86_64 dist \
            "$(g++ -print-file-name=libgomp.so.1)"
          pipx run auditwheel show dist/*.whl | tee auditwheel.txt
          grep -q 'manylinux_2_35_x86_64' auditwheel.txt
      - name: Run the demo from the archive, in a container with no compiler
        run: |
          docker run --rm -v "$PWD/dist:/dist" ubuntu:22.04 bash -c '
            set -euo pipefail
            apt-get update -qq && apt-get install -y -qq python3 >/dev/null
            if command -v g++ || command -v cc; then echo "a compiler is present"; exit 1; fi
            cd /tmp && tar -xzf /dist/sankhya-*-linux-x86_64-cpu.tar.gz && cd sankhya-*/
            start=$(date +%s%N)
            build/sankhya version
            build/sankhya solve demo/crude_blend.mps --write-sol /tmp/blend.sol
            python3 tools/verify_solution.py demo/crude_blend.mps /tmp/blend.sol
            PYTHONPATH=bindings/python python3 -c "import sankhya; print(sankhya.Model.read(\"demo/crude_blend.mps\").solve().objective)"
            echo "Linux x86-64 CPU archive, bare ubuntu:22.04 container: demo, verifier and bindings in $(( ($(date +%s%N) - start) / 1000000 )) ms" |
              tee /dist/timing-linux-x86_64-cpu.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: sankhya-linux-x86_64-cpu
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.whl
            dist/timing-*.txt
            dist/link-line-*.txt

  linux-cuda:
    name: Linux x86-64 CUDA archive (compiled without a card)
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.6.0-devel-ubuntu22.04
    steps:
      # git before the checkout: without it actions/checkout downloads a tarball with no
      # history, and the binary is stamped "unknown" instead of its commit.
      - name: Install toolchain
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sed -i 's|http://security.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list
          for attempt in 1 2 3; do
            apt-get update && apt-get install -y ninja-build cmake g++ git python3 && break
            [ "$attempt" = 3 ] && exit 1
            sleep 30
          done
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build
        # The CUDA runtime and cuSPARSE linked statically (SANKHYA_CUDA_STATIC), so the host
        # needs only the NVIDIA driver, not a toolkit of a matching version.
        run: |
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DSANKHYA_BUILD_TESTS=OFF \
            -DSANKHYA_ENABLE_CUDA=ON -DSANKHYA_CUDA_STATIC=ON \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc -DCMAKE_DISABLE_FIND_PACKAGE_ZLIB=ON \
            "-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc" \
            "-DCMAKE_SHARED_LINKER_FLAGS=-static-libstdc++ -static-libgcc" \
            '-DCMAKE_BUILD_RPATH=$ORIGIN'
          cmake --build build -j
      - name: Package
        run: |
          scripts/package_release.sh build linux-x86_64-cuda dist \
            "$(g++ -print-file-name=libgomp.so.1)"
      - name: No CUDA library is a runtime dependency
        run: |
          ldd build/sankhya
          if ldd build/sankhya | grep -E 'libcudart|libcusparse'; then exit 1; fi
      - name: Without a card the binary says so and solves on the CPU
        run: |
          build/sankhya version
          build/sankhya solve demo/crude_blend.mps --gpu --write-sol blend.sol
          python3 tools/verify_solution.py demo/crude_blend.mps blend.sol
      - uses: actions/upload-artifact@v4
        with:
          name: sankhya-linux-x86_64-cuda
          path: |
            dist/*.tar.gz
            dist/*.sha256

  windows-cpu:
    name: Windows x64 CPU archive
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            git zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Build
        # MinGW links libstdc++ and libgcc statically (CMakeLists.txt); zlib is built in.
        run: |
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DSANKHYA_BUILD_TESTS=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_ZLIB=ON
          cmake --build build -j
      - name: Package
        # Every DLL the binary or the library imports from the toolchain goes beside them.
        run: |
          extras=$(ldd build/sankhya.exe build/libsankhya.dll | awk '/ucrt64/ {print $3}' | sort -u)
          echo "shipping: $extras"
          scripts/package_release.sh build windows-x64-cpu dist $extras
          mkdir -p wheel-libs && cp $extras wheel-libs/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run the demo from the archive, with no compiler on PATH
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/*.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath $env:RUNNER_TEMP
          $dir = Get-ChildItem $env:RUNNER_TEMP -Directory -Filter 'sankhya-*' | Select-Object -First 1
          Set-Location $dir.FullName
          # The runner image carries compilers on PATH; the run gets Windows and Python only.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:pythonLocation"
          foreach ($cc in 'g++', 'gcc', 'cl', 'clang') {
            if (Get-Command $cc -ErrorAction SilentlyContinue) { throw "$cc is on PATH" }
          }
          $t = [Diagnostics.Stopwatch]::StartNew()
          .\build\sankhya.exe version
          .\build\sankhya.exe solve demo\crude_blend.mps --write-sol blend.sol
          if ($LASTEXITCODE -ne 0) { throw "solve failed" }
          python tools\verify_solution.py demo\crude_blend.mps blend.sol
          if ($LASTEXITCODE -ne 0) { throw "verifier rejected" }
          $env:PYTHONPATH = "bindings\python"
          python -c "import sankhya; print(sankhya.Model.read('demo/crude_blend.mps').solve().objective)"
          if ($LASTEXITCODE -ne 0) { throw "bindings failed" }
          "Windows x64 CPU archive, windows-latest runner with no compiler on PATH: demo, verifier and bindings in {0:N2} s" -f $t.Elapsed.TotalSeconds |
            Tee-Object "$env:GITHUB_WORKSPACE\dist\timing-windows-x64-cpu.txt"
      - name: Wheel
        shell: pwsh
        run: python scripts/build_wheel.py build win_amd64 dist (Get-ChildItem wheel-libs/*).FullName
      - uses: actions/upload-artifact@v4
        with:
          name: sankhya-windows-x64-cpu
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*.whl
            dist/timing-*.txt

  wheel-test:
    # One wheel per platform serves every CPython (ctypes, no extension module; see
    # scripts/build_wheel.py). Each is installed into a clean venv of each version and must
    # solve the demo, have the verifier accept the answer, and agree with it from Python.
    name: Wheel on ${{ matrix.os }}, Python ${{ matrix.python }}
    needs: [linux-cpu, windows-cpu]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.os == 'windows-latest' && 'sankhya-windows-x64-cpu' || 'sankhya-linux-x86_64-cpu' }}
          path: dist
      - name: Install into a clean venv, then solve, verify and compare
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          py="$RUNNER_TEMP/venv/bin/python"; [ -f "$py" ] || py="$RUNNER_TEMP/venv/Scripts/python.exe"
          "$py" -m pip install --no-index dist/*.whl
          cd "$RUNNER_TEMP" && "$py" "$GITHUB_WORKSPACE/scripts/wheel_smoke.py" "$GITHUB_WORKSPACE"

  container:
    name: Container image (pushed to ghcr.io on a tag only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build the image
        run: docker build -t sankhya:ci .
      - name: The image solves and verifies the demo (CPU; the runner has no card)
        run: |
          docker run --rm sankhya:ci sankhya version
          docker run --rm sankhya:ci sh -c \
            'sankhya solve demo/crude_blend.mps --gpu --write-sol /tmp/b.sol &&
             python3 tools/verify_solution.py demo/crude_blend.mps /tmp/b.sol'
      - name: Push to ghcr.io (tag runs only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/thegoodengineers/sankhya:${GITHUB_REF_NAME}"
          docker tag sankhya:ci "$image"
          docker push "$image"
      - name: Save the image
        run: docker save sankhya:ci | gzip > sankhya-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: sankhya-container-image
          path: sankhya-image.tar.gz
          retention-days: 7

  checksums:
    name: SHA256SUMS over every archive
    needs: [linux-cpu, linux-cuda, windows-cpu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: |
          cd dist
          sha256sum *.tar.gz *.zip *.whl | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: sankhya-SHA256SUMS
          path: dist/SHA256SUMS

  draft-release:
    # A tag run leaves a DRAFT pre-release with every archive and the sums attached. Making
    # it public is a person's click on the release page, after reading the notes.
    name: Draft pre-release (tag runs only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checksums, container, wheel-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          [ -f "$notes" ] || { echo "no $notes: write the notes before tagging"; exit 1; }
          # The fresh-machine timings this run measured, appended to the written notes.
          { cat "$notes"; echo; echo "## Measured by this release's CI run"; echo
            for t in dist/timing-*.txt; do echo "- $(cat "$t")"; done; } > notes.md
          gh release create "$GITHUB_REF_NAME" --draft --prerelease \
            --title "SANKHYA $GITHUB_REF_NAME" --notes-file notes.md \
            dist/*.tar.gz dist/*.zip dist/*.whl dist/SHA256SUMS
