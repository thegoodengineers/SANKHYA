# SPDX-License-Identifier: Apache-2.0
# SANKHYA - release archives and the container image, built by CI alone (#748).
#
# Every leg builds from a clean runner, packages with scripts/package_release.sh (which also
# runs the provenance check on the SHIPPED binaries), then unpacks the archive on a machine
# or container with no compiler and solves and verifies the demo from it. The outputs are
# workflow artifacts. Publishing them - a GitHub Release, a push to a registry - is a
# deliberate manual step and is not done here.
#
# What is not built, and why:
#   Windows CUDA: nvcc on Windows requires MSVC as its host compiler, and this tree builds
#   with MinGW-w64 GCC (the -static runtime link in CMakeLists.txt). A CUDA build for Windows
#   needs the tree to build under MSVC first.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/package_release.sh
      - Dockerfile

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-cpu:
    name: Linux x86-64 CPU archive
    # 22.04 rather than latest: the archive runs on glibc 2.35 and every later one.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++
      - name: Build
        # The distribution's GCC 11, as in the CUDA container: GCC 12 reports a -Wrestrict
        # false positive inside libstdc++ under -Werror. libstdc++ and libgcc linked
        # statically, zlib built in (no system zlib is assumed on the target), libgomp
        # shipped beside the binary and found through $ORIGIN.
        run: |
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DSANKHYA_BUILD_TESTS=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_ZLIB=ON \
            "-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc" \
            "-DCMAKE_SHARED_LINKER_FLAGS=-static-libstdc++ -static-libgcc" \
            '-DCMAKE_BUILD_RPATH=$ORIGIN'
          cmake --build build -j
      - name: Package
        run: |
          scripts/package_release.sh build linux-x86_64-cpu dist \
            "$(g++ -print-file-name=libgomp.so.1)"
          ninja -C build -t commands sankhya | tail -1 > dist/link-line-linux-cpu.txt
      - name: Run the demo from the archive, in a container with no compiler
        run: |
          docker run --rm -v "$PWD/dist:/dist" ubuntu:22.04 bash -c '
            set -euo pipefail
            apt-get update -qq && apt-get install -y -qq python3 >/dev/null
            if command -v g++ || command -v cc; then echo "a compiler is present"; exit 1; fi
            cd /tmp && tar -xzf /dist/sankhya-*-linux-x86_64-cpu.tar.gz && cd sankhya-*/
            start=$(date +%s%N)
            build/sankhya version
            build/sankhya solve demo/crude_blend.mps --write-sol /tmp/blend.sol
            python3 tools/verify_solution.py demo/crude_blend.mps /tmp/blend.sol
            PYTHONPATH=bindings/python python3 -c "import sankhya; print(sankhya.Model.read(\"demo/crude_blend.mps\").solve().objective)"
            echo "demo and verifier from the archive: $(( ($(date +%s%N) - start) / 1000000 )) ms"'
      - uses: actions/upload-artifact@v4
        with:
          name: sankhya-linux-x86_64-cpu
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/link-line-*.txt

  linux-cuda:
    name: Linux x86-64 CUDA archive (compiled without a card)
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.6.0-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install toolchain
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sed -i 's|http://security.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list
          for attempt in 1 2 3; do
            apt-get update && apt-get install -y ninja-build cmake g++ git python3 && break
            [ "$attempt" = 3 ] && exit 1
            sleep 30
          done
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build
        # The CUDA runtime and cuSPARSE linked statically (SANKHYA_CUDA_STATIC), so the host
        # needs only the NVIDIA driver, not a toolkit of a matching version.
        run: |
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DSANKHYA_BUILD_TESTS=OFF \
            -DSANKHYA_ENABLE_CUDA=ON -DSANKHYA_CUDA_STATIC=ON \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc -DCMAKE_DISABLE_FIND_PACKAGE_ZLIB=ON \
            "-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc" \
            "-DCMAKE_SHARED_LINKER_FLAGS=-static-libstdc++ -static-libgcc" \
            '-DCMAKE_BUILD_RPATH=$ORIGIN'
          cmake --build build -j
      - name: Package
        run: |
          scripts/package_release.sh build linux-x86_64-cuda dist \
            "$(g++ -print-file-name=libgomp.so.1)"
      - name: No CUDA library is a runtime dependency
        run: |
          ldd build/sankhya
          if ldd build/sankhya | grep -E 'libcudart|libcusparse'; then exit 1; fi
      - name: Without a card the binary says so and solves on the CPU
        run: |
          build/sankhya version
          build/sankhya solve demo/crude_blend.mps --gpu --write-sol blend.sol
          python3 tools/verify_solution.py demo/crude_blend.mps blend.sol
      - uses: actions/upload-artifact@v4
        with:
          name: sankhya-linux-x86_64-cuda
          path: |
            dist/*.tar.gz
            dist/*.sha256

  windows-cpu:
    name: Windows x64 CPU archive
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            git zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Build
        # MinGW links libstdc++ and libgcc statically (CMakeLists.txt); zlib is built in.
        run: |
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DSANKHYA_BUILD_TESTS=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_ZLIB=ON
          cmake --build build -j
      - name: Package
        # Every DLL the binary or the library imports from the toolchain goes beside them.
        run: |
          extras=$(ldd build/sankhya.exe build/libsankhya.dll | awk '/ucrt64/ {print $3}' | sort -u)
          echo "shipping: $extras"
          scripts/package_release.sh build windows-x64-cpu dist $extras
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run the demo from the archive, with no compiler on PATH
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/*.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath $env:RUNNER_TEMP
          $dir = Get-ChildItem $env:RUNNER_TEMP -Directory -Filter 'sankhya-*' | Select-Object -First 1
          Set-Location $dir.FullName
          # The runner image carries compilers on PATH; the run gets Windows and Python only.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:pythonLocation"
          foreach ($cc in 'g++', 'gcc', 'cl', 'clang') {
            if (Get-Command $cc -ErrorAction SilentlyContinue) { throw "$cc is on PATH" }
          }
          $t = [Diagnostics.Stopwatch]::StartNew()
          .\build\sankhya.exe version
          .\build\sankhya.exe solve demo\crude_blend.mps --write-sol blend.sol
          if ($LASTEXITCODE -ne 0) { throw "solve failed" }
          python tools\verify_solution.py demo\crude_blend.mps blend.sol
          if ($LASTEXITCODE -ne 0) { throw "verifier rejected" }
          $env:PYTHONPATH = "bindings\python"
          python -c "import sankhya; print(sankhya.Model.read('demo/crude_blend.mps').solve().objective)"
          if ($LASTEXITCODE -ne 0) { throw "bindings failed" }
          "demo and verifier from the archive: {0:N2}s" -f $t.Elapsed.TotalSeconds
      - uses: actions/upload-artifact@v4
        with:
          name: sankhya-windows-x64-cpu
          path: |
            dist/*.zip
            dist/*.sha256

  container:
    name: Container image (built, not pushed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build the image
        run: docker build -t sankhya:ci .
      - name: The image solves and verifies the demo (CPU; the runner has no card)
        run: |
          docker run --rm sankhya:ci sankhya version
          docker run --rm sankhya:ci sh -c \
            'sankhya solve demo/crude_blend.mps --gpu --write-sol /tmp/b.sol &&
             python3 tools/verify_solution.py demo/crude_blend.mps /tmp/b.sol'
      - name: Save the image
        run: docker save sankhya:ci | gzip > sankhya-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: sankhya-container-image
          path: sankhya-image.tar.gz
          retention-days: 7

  checksums:
    name: SHA256SUMS over every archive
    needs: [linux-cpu, linux-cuda, windows-cpu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: |
          cd dist
          sha256sum *.tar.gz *.zip | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: sankhya-SHA256SUMS
          path: dist/SHA256SUMS
