name: gcc15-probe
on:
  push:
    branches: [fix/gcc15-1100]
  workflow_dispatch:
jobs:
  # Netlib, both arms in one job on one machine: the tree as it stands (-ffp-contract=off)
  # against the same tree with that one line removed (GCC's default, contraction on).
  ab-contract:
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zlib1g-dev
      - uses: actions/cache@v4
        with:
          path: data/netlib
          key: netlib-full-v1-${{ hashFiles('bench/runners/fetch_data.py') }}
      - run: python3 bench/runners/fetch_data.py --set full --offline-fallback
      - name: build both arms
        run: |
          set -euxo pipefail
          g++ --version | head -1
          rm -rf /tmp/arm-fast && mkdir /tmp/arm-fast && git archive HEAD | tar -x -C /tmp/arm-fast
          grep -c 'ffp-contract=off>' /tmp/arm-fast/CMakeLists.txt
          sed -i '/ffp-contract=off>/d' /tmp/arm-fast/CMakeLists.txt
          ! grep -q 'ffp-contract=off>' /tmp/arm-fast/CMakeLists.txt
          cmake -G Ninja -S . -B build-off -DCMAKE_BUILD_TYPE=Release -DSANKHYA_BUILD_TESTS=OFF
          cmake --build build-off -j --target sankhya-cli
          cmake -G Ninja -S /tmp/arm-fast -B build-fast -DCMAKE_BUILD_TYPE=Release -DSANKHYA_BUILD_TESTS=OFF
          cmake --build build-fast -j --target sankhya-cli
          objdump -d build-off/sankhya | grep -c vfmadd || true
          objdump -d build-fast/sankhya | grep -c vfmadd || true
      - name: netlib, both arms
        run: |
          set -x
          c=$(git rev-parse --short=8 HEAD)
          python3 bench/runners/netlib.py --binary build-off/sankhya --time-limit 120 --machine gh-ubuntu-26.04-gcc15 --out bench/results/gcc15-contract-ab-netlib-off-$c.csv || true
          python3 bench/runners/netlib.py --binary build-fast/sankhya --time-limit 120 --machine gh-ubuntu-26.04-gcc15 --out bench/results/gcc15-contract-ab-netlib-fast-$c.csv || true
          python3 bench/runners/netlib.py --binary build-off/sankhya --time-limit 30 --solver-option algorithm=pdhg --machine gh-ubuntu-26.04-gcc15 --out bench/results/gcc15-contract-ab-netlib-pdhg-off-$c.csv || true
          python3 bench/runners/netlib.py --binary build-fast/sankhya --time-limit 30 --solver-option algorithm=pdhg --machine gh-ubuntu-26.04-gcc15 --out bench/results/gcc15-contract-ab-netlib-pdhg-fast-$c.csv || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ab-contract
          path: bench/results/gcc15-*.csv

  # The exact dual prox against main on the evidence toolchain (GCC 13, ubuntu-24.04), both
  # arms in one job; plus the proof that -ffp-contract=off changes no instruction there.
  ab-moreau:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zlib1g-dev
      - uses: actions/cache@v4
        with:
          path: data/netlib
          key: netlib-full-v1-${{ hashFiles('bench/runners/fetch_data.py') }}
      - run: python3 bench/runners/fetch_data.py --set full --offline-fallback
      - name: build three arms
        run: |
          set -euxo pipefail
          g++ --version | head -1
          base=$(git merge-base HEAD origin/main)
          echo "base $base"
          rm -rf /tmp/arm-main /tmp/arm-nocflag && mkdir /tmp/arm-main /tmp/arm-nocflag
          git archive "$base" | tar -x -C /tmp/arm-main
          git archive HEAD | tar -x -C /tmp/arm-nocflag
          sed -i '/ffp-contract=off>/d' /tmp/arm-nocflag/CMakeLists.txt
          cmake -G Ninja -S . -B build-new -DCMAKE_BUILD_TYPE=Release -DSANKHYA_BUILD_TESTS=OFF
          cmake --build build-new -j --target sankhya-cli
          cmake -G Ninja -S /tmp/arm-main -B build-main -DCMAKE_BUILD_TYPE=Release -DSANKHYA_BUILD_TESTS=OFF
          cmake --build build-main -j --target sankhya-cli
          cmake -G Ninja -S /tmp/arm-nocflag -B build-nocflag -DCMAKE_BUILD_TYPE=Release -DSANKHYA_BUILD_TESTS=OFF
          cmake --build build-nocflag -j --target sankhya-cli
          echo "--- -ffp-contract=off on x86-64 baseline: disassembly of every core object, with against without"
          n=0; d=0
          for o in $(cd build-new && find CMakeFiles/sankhya_objects.dir -name '*.o' | sort); do
            n=$((n+1))
            if ! cmp -s <(objdump -d --no-show-raw-insn build-new/$o | tail -n +3) <(objdump -d --no-show-raw-insn build-nocflag/$o | tail -n +3); then d=$((d+1)); echo "differs: $o"; fi
          done
          echo "objects compared: $n, differing: $d"
      - name: netlib, main against this branch
        run: |
          set -x
          c=$(git rev-parse --short=8 HEAD)
          python3 bench/runners/netlib.py --binary build-main/sankhya --time-limit 120 --machine gh-ubuntu-24.04-gcc13 --out bench/results/moreau-ab-netlib-main-$c.csv || true
          python3 bench/runners/netlib.py --binary build-new/sankhya --time-limit 120 --machine gh-ubuntu-24.04-gcc13 --out bench/results/moreau-ab-netlib-new-$c.csv || true
          python3 bench/runners/netlib.py --binary build-main/sankhya --time-limit 30 --solver-option algorithm=pdhg --machine gh-ubuntu-24.04-gcc13 --out bench/results/moreau-ab-netlib-pdhg-main-$c.csv || true
          python3 bench/runners/netlib.py --binary build-new/sankhya --time-limit 30 --solver-option algorithm=pdhg --machine gh-ubuntu-24.04-gcc13 --out bench/results/moreau-ab-netlib-pdhg-new-$c.csv || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ab-moreau
          path: bench/results/moreau-*.csv
