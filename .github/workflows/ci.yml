# SPDX-License-Identifier: Apache-2.0
# SANKHYA - continuous integration.
#
# ubuntu-latest is the authority on -Werror cleanliness and on the sanitizer runs; the
# Windows build is a developer convenience and is not gated here.
#
# The `provenance` job is not decoration. ENGINEERING_RULES.md commits us to proving that nothing from
# an optimization solver is linked in, and the cheapest proof is a machine-generated link
# line plus `ldd` on every pull request, so the claim cannot silently rot.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a PR branch makes its older run worthless, so that run is cancelled. A
# push to main is a merge, and every merge must end in a real pass or fail: with the group
# keyed on the ref, each merge cancelled the previous merge's run (7 of the last 20 runs on
# main ended "cancelled"), which left main commits with no verdict and a red-looking X.
# Keying main's runs on the commit puts every merge in its own group, so none is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  thread-sanitizer:
    # The parallel tree search (#222), the engine race (#476), the row-parallel SpMV (#487),
    # and the KKT check (#476) under ThreadSanitizer: a data race in concurrent code shows up
    # as a wrong bound or a wrong winner once a month, not as a crash. OpenMP is off because
    # libgomp is not instrumented and TSan cannot see its synchronisation (#535).
    name: TSan (MILP tree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zlib1g-dev

      - name: Configure
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DSANKHYA_TSAN=ON \
            -DSANKHYA_WITH_OPENMP=OFF \
            -DSANKHYA_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j --target sankhya_tests

      - name: MILP and concurrent tests under ThreadSanitizer
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: >-
          ./build/tests/sankhya_tests
          --gtest_filter='ParallelTree.*:BranchAndBound*.*:SolutionPool*.*:NodeSelection*.*:ResourceLimits.*:EngineConcurrency.*:EngineRace.*:KktCheck.*:PdhgParallelSpmv.*'

  fuzz-readers:
    # #534: a libFuzzer target per reader (MPS fixed, MPS free, LP, QPS' QUADOBJ extension),
    # under ASan+UBSan, seeded from fuzz/corpus/. libFuzzer is a clang/LLVM feature with no
    # GCC equivalent, so this job installs clang rather than adding it to every build - the
    # other jobs stay on GCC, which is what ENGINEERING_RULES.md holds to -Werror cleanliness.
    name: Fuzz the model readers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zlib1g-dev clang

      - name: Configure
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DSANKHYA_ENABLE_FUZZING=ON \
            -DSANKHYA_BUILD_TESTS=OFF

      - name: Build
        run: >-
          cmake --build build -j
          --target fuzz_mps_fixed fuzz_mps_free fuzz_lp fuzz_qps

      - name: Fuzz each reader for a fixed time
        # A crash writes an artifact under -artifact_prefix and libFuzzer exits non-zero,
        # which fails this step under set -e; a reproducer that is a genuine bug gets
        # minimized and checked into fuzz/corpus/<dialect>/ in the fixing PR, which is what
        # turns it into a permanent regression the next run of this job covers.
        run: |
          set -euo pipefail
          mkdir -p /tmp/fuzz-artifacts
          for dialect in mps_fixed mps_free lp qps; do
            echo "=== fuzz_${dialect} ==="
            mkdir -p "/tmp/fuzz-grow-${dialect}"
            "./build/fuzz_${dialect}" -max_total_time=45 -print_final_stats=1 \
              -artifact_prefix="/tmp/fuzz-artifacts/${dialect}-" \
              "/tmp/fuzz-grow-${dialect}" "fuzz/corpus/${dialect}"
          done

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: /tmp/fuzz-artifacts/

  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # The suites that start their own threads, or assert on how threads shared work. They run
    # after the parallel set, one at a time (see the Test step for why). Named once here
    # because the Test step and the shard coverage check below must agree on it exactly.
    env:
      SERIAL_TESTS: '^(ParallelTree|PdhgParallelSpmv|EngineConcurrency|EngineRace|EngineDeterminism|Deterministic)\.'
    strategy:
      fail-fast: false
      matrix:
        # Fields besides the build flags:
        #   cache_key       the compiler cache and test timings this leg restores
        #   save_cache      this leg saves them back, on main
        #   parallel_tests  this leg runs the parallel set (everything but SERIAL_TESTS)
        #   shard_index,    which part of the parallel set: ctest's -I index,,count, every
        #   shard_count     count-th test from the index-th. Unset = all of it.
        #   serial_tests    this leg runs the serial set (SERIAL_TESTS above)
        #   after_tests     this leg runs the CLI smoke test, the synthetic LP and the case
        #                   studies, the steps that ran on both Release and the ASan leg
        include:
          - name: Release
            build_type: Release
            sanitize: OFF
            debug_flags: ""
            cache_key: Release
            save_cache: true
            parallel_tests: true
            serial_tests: true
            after_tests: true
          # -O1 rather than the Debug default -O0: the AddressSanitizer documentation
          # recommends it for reasonable performance, every check still runs, and the build
          # stays Debug so assert() is still compiled in. At -O0 this leg took 15 to 20
          # minutes, most of it the test suite and the case studies. At -O1 GCC 13 reports a
          # known false positive, maybe-uninitialized, inside libstdc++'s own std::regex
          # (std_function.h), so that one warning stays a warning here; the Release leg still
          # builds everything with -Werror and the warning on.
          #
          # SPLIT THREE WAYS. With the compiler cache warm (#673) this leg was 10 minutes, 7
          # of them one Test step (403 s parallel, 25 s serial) and 2.5 the case studies after
          # it, which made it the job every merge waited for. Each part rebuilds from the same
          # cache in about 15 s. (1/2) and (2/2) each run every other test of the parallel
          # set, so no test is dropped and none runs twice - the step "The shards cover every
          # test exactly once" proves that on every run. The third part runs the serial set
          # and the post-test steps.
          #
          # Why a third part rather than putting those on one of the halves: -I deals tests
          # by their position in the list, so which half the slowest test lands on flips
          # whenever a test is added before it. On this change's first run one test,
          # FeasibilityJump.TheSearchWithItOnAgreesWithTheExactOracle, was the whole of its
          # half's 329 s; a half that also carried the 2.5 minutes of case studies would have
          # been back near 9 minutes on every other pull request. With both halves holding
          # only parallel tests, neither can be longer than its slowest test allows.
          - name: Debug+ASan+UBSan (1/2)
            build_type: Debug
            sanitize: ON
            debug_flags: "-g -O1 -Wno-error=maybe-uninitialized"
            cache_key: Debug+ASan+UBSan-1of2
            save_cache: true
            parallel_tests: true
            shard_index: 1
            shard_count: 2
            serial_tests: false
            after_tests: false
          - name: Debug+ASan+UBSan (2/2)
            build_type: Debug
            sanitize: ON
            debug_flags: "-g -O1 -Wno-error=maybe-uninitialized"
            cache_key: Debug+ASan+UBSan-2of2
            save_cache: true
            parallel_tests: true
            shard_index: 2
            shard_count: 2
            serial_tests: false
            after_tests: false
          # Borrows (1/2)'s cache and saves none of its own: the compiler output is the same
          # for every part, and timings only reorder a parallel run, which this part has not.
          - name: Debug+ASan+UBSan (serial, end to end)
            build_type: Debug
            sanitize: ON
            debug_flags: "-g -O1 -Wno-error=maybe-uninitialized"
            cache_key: Debug+ASan+UBSan-1of2
            save_cache: false
            parallel_tests: false
            serial_tests: true
            after_tests: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zlib1g-dev ccache

      # The compiler cache and ctest's record of how long each test took, restored from the
      # newest run of this leg on main. The Debug+ASan+UBSan leg is the one every merge
      # waits for: 7 minutes of build, most of it recompiling files the change did not
      # touch, and a test step whose three longest tests (192, 149 and 134 s under ASan)
      # started last because a fresh build has no timings, so ctest could not schedule
      # them first. With the timings file restored it starts the longest tests first.
      # Saved only from main, so pull requests read main's cache and do not evict it.
      #
      # One key per ASan half, not one shared key. ctest rewrites the timings file after a
      # run with fresh times for the tests it ran and the old entries for the rest, so if
      # only one half saved, the other half's times would stay frozen at whatever they were
      # when the split landed. Each half saving its own keeps both current, at the cost of a
      # second copy of the same ~150 MB compiler cache per merge. The second restore key is
      # the prefix every ASan key shares, including the one the unsplit leg saved under: it
      # lets the first run after the split, and any part whose own key has been evicted,
      # start from a warm cache instead of a 7-minute cold build. The timings file is per
      # test name, so any part can use any part's file.
      - name: Restore the compiler cache and the test timings
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/ccache
            build/Testing/Temporary/CTestCostData.txt
          key: build-${{ matrix.cache_key }}-${{ github.sha }}
          restore-keys: |
            build-${{ matrix.cache_key }}-
            build-${{ matrix.build_type == 'Debug' && 'Debug+ASan+UBSan' || 'Release' }}-

      - name: Report compiler version
        run: g++ --version

      - name: Configure
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DSANKHYA_SANITIZE=${{ matrix.sanitize }} \
            ${{ matrix.debug_flags && format('-DCMAKE_CXX_FLAGS_DEBUG="{0}"', matrix.debug_flags) || '' }} \
            -DSANKHYA_BUILD_TESTS=ON             -DCMAKE_C_COMPILER_LAUNCHER=ccache             -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        # No CCACHE_BASEDIR: it rewrites absolute source paths to relative ones, so __FILE__
        # becomes "../tests/unit/...", and the tests that find data/netlib/ from __FILE__
        # stop finding it (121 failures on the first run of this change). The runner checks
        # out to the same absolute path every time, so the cache hits without it.
        env:
          CCACHE_MAXSIZE: 2G
        run: |
          ccache --zero-stats
          cmake --build build -j
          ccache --show-stats

      # A split test run is only as good as the proof that it drops nothing. This lists the
      # tests (ctest -N runs none) that each half's parallel set and the serial set select,
      # and fails unless together they are exactly the full list: every test once, none
      # twice, none missing. It runs on both halves and checks every set, not only its own,
      # so each half's log shows all the counts. ctest's -I numbers the FULL test list and -E then filters, so
      # a test added anywhere moves others between halves but can never fall between them.
      - name: The shards cover every test exactly once
        if: matrix.shard_count
        env:
          SHARD_COUNT: ${{ matrix.shard_count }}
        run: |
          set -euo pipefail
          names() { ctest --test-dir build -N "$@" | sed -n 's/^ *Test *#[0-9]*: //p'; }
          names > "$RUNNER_TEMP/all.txt"
          : > "$RUNNER_TEMP/union.txt"
          for i in $(seq 1 "$SHARD_COUNT"); do
            names -E "$SERIAL_TESTS" -I "$i,,$SHARD_COUNT" > "$RUNNER_TEMP/shard-$i.txt"
            echo "shard $i/$SHARD_COUNT, parallel set: $(wc -l < "$RUNNER_TEMP/shard-$i.txt") tests"
            cat "$RUNNER_TEMP/shard-$i.txt" >> "$RUNNER_TEMP/union.txt"
          done
          names -R "$SERIAL_TESTS" > "$RUNNER_TEMP/serial.txt"
          echo "serial set:              $(wc -l < "$RUNNER_TEMP/serial.txt") tests"
          cat "$RUNNER_TEMP/serial.txt" >> "$RUNNER_TEMP/union.txt"
          echo "sum of the above:        $(wc -l < "$RUNNER_TEMP/union.txt") tests"
          echo "unsplit run (ctest -N):  $(wc -l < "$RUNNER_TEMP/all.txt") tests"
          twice=$(sort "$RUNNER_TEMP/union.txt" | uniq -d)
          if [ -n "$twice" ]; then
            echo "FAIL: selected by more than one set:"; echo "$twice"; exit 1
          fi
          if ! diff <(sort "$RUNNER_TEMP/all.txt") <(sort "$RUNNER_TEMP/union.txt"); then
            echo "FAIL: the sets above differ from the unsplit list (< missing, > extra)"
            exit 1
          fi
          echo "OK: every test is in exactly one set"

      - name: Test
        env:
          # halt_on_error keeps a sanitizer report from being buried under later output.
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        # Most tests run in parallel, one per runner core. The suites that start their own
        # threads, or assert on how threads shared work, run afterwards one at a time: beside
        # other tests they fight for the same cores, and on the first parallel run
        # PdhgParallelSpmv took 649 s per test under ASan and ParallelTree's work-sharing count
        # came out 46 against its floor of 50 while every answer still agreed.
        #
        # On the split ASan leg each half runs its share of the parallel set (-I, see the
        # matrix) and the third part runs the serial set; Release runs both, whole.
        run: |
          set -euo pipefail
          if [ "${{ matrix.parallel_tests }}" = true ]; then
            ctest --test-dir build --output-on-failure -j "$(nproc)" -E "$SERIAL_TESTS" \
              ${{ matrix.shard_count && format('-I {0},,{1}', matrix.shard_index, matrix.shard_count) || '' }}
          fi
          if [ "${{ matrix.serial_tests }}" = true ]; then
            ctest --test-dir build --output-on-failure -R "$SERIAL_TESTS"
          fi

      # After the tests, so the timings file holds this run's times. A failed run saves
      # nothing: `if: success()` is the default for a step.
      - name: Save the compiler cache and the test timings
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.save_cache
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/ccache
            build/Testing/Temporary/CTestCostData.txt
          key: build-${{ matrix.cache_key }}-${{ github.sha }}

      # The bindings are pure ctypes over the shared library, so there is no extension to
      # build and no Python dependency to install - but that also means nothing else in CI
      # would notice if the C API's symbols stopped being exported, or if a signature
      # changed underneath them. This step is what makes that a build failure rather than a
      # discovery made by whoever next imports the package.
      - name: Python bindings
        # RELEASE ONLY, and not because the bindings are less important under a sanitizer.
        # ASan cannot instrument a library that is dlopen'd into an uninstrumented process:
        # "ASan runtime does not come first in initial library list". Making it work would
        # mean LD_PRELOADing the runtime into python3, which puts CPython itself under leak
        # detection and reports its interpreter allocations as failures.
        #
        # Nothing is lost. The bindings are pure Python over ctypes - there is no C++ here
        # for a sanitizer to check - and the C API they call IS covered under ASan, by
        # tests/unit/test_c_api.cpp in this same job.
        if: matrix.name == 'Release'
        run: PYTHONPATH=bindings/python python3 bindings/python/test_bindings.py

      # The PuLP adapter runs under both PuLP majors (#690): 4.0 replaced the LpStatus*
      # constants with LpSolveStatus and made actualSolve return LpSolveStats, and the adapter
      # speaks both. Each leg asserts the major it installed, because a PuLP that fails to
      # import turns every PuLP test into a SKIP and the suite would still pass.
      - name: The Pyomo, PuLP 3.x and CVXPY adapters solve through SANKHYA (#536)
        # Optional libraries, installed only here: importing sankhya never imports them.
        if: matrix.name == 'Release'
        run: |
          pip install "pulp<4" pyomo cvxpy
          python3 -c "import pulp, sys; v = pulp.__version__; print('PuLP', v); sys.exit(int(v.split('.')[0]) >= 4)"
          PYTHONPATH=bindings/python python3 bindings/python/test_adapters.py

      - name: The PuLP 4.x adapter solves through SANKHYA (#690)
        if: matrix.name == 'Release'
        run: |
          pip install "pulp>=4,<5"
          python3 -c "import pulp, sys; v = pulp.__version__; print('PuLP', v); sys.exit(int(v.split('.')[0]) != 4)"
          PYTHONPATH=bindings/python python3 bindings/python/test_adapters.py

      - name: Infeasibility repair - the repaired model verifies feasible (#523)
        if: matrix.name == 'Release'
        run: PYTHONPATH=bindings/python python3 tools/test_repair_infeasibility.py

      - name: Benchmark result selection is deterministic (#255)
        # bench/runners/latest_result.py decides which CSV each tier of docs/BENCHMARKS.md
        # cites; this pins the git-history-then-recorded-timestamp order against mtime, which
        # a fresh clone scrambles.
        if: matrix.name == 'Release'
        run: python3 bench/runners/test_latest_result.py

      - name: Netlib infeasible set parsing and pass criterion (#529)
        # Pure Python, no network: the readme table parser, the certificate read out of a
        # .sol file, and the rule that `infeasible` without a verified Farkas certificate is
        # not a pass.
        if: matrix.name == 'Release'
        run: python3 bench/runners/test_netlib_infeasible.py

      - name: Netlib fetch falls back to the tracked copies when netlib.org is down
        # No network: the base URL points at a closed local port. With --offline-fallback the
        # tracked readme and instances are used unchanged; without it the outage still fails.
        if: matrix.name == 'Release'
        run: python3 bench/runners/test_fetch_offline.py

      - name: The relative-KKT crossing columns and their doc tables (#486)
        # Pure Python, no solve: blanks for a non-PDHG row, nan kept for a level never
        # reached, the ordering check, and the generated tables that label the 1e-6
        # crossing as the feasibility-page standard, not an optimal basis.
        if: matrix.name == 'Release'
        run: python3 bench/runners/test_kkt_crossings.py

      - name: The GPU runners' CPU arms, gaps and doc tables (#488)
        # Pure Python, no solve, no GPU: the two CPU arms and the options each passes (the
        # N-thread one must turn pdhg_parallel_spmv on), the |obj-ref|/max(1,|ref|) gap, the
        # residual parse, both runners' rows, and the tables for new and pre-#488 CSVs.
        if: matrix.name == 'Release'
        run: python3 bench/runners/test_gpu_runners.py

      - name: Results CSVs are stamped from the binary, not the tree (#433)
        if: matrix.name == 'Release'
        run: python3 bench/runners/test_stamp.py

      - name: The independent verifier passes its own self-test (#542)
        if: matrix.name == 'Release'
        run: python3 tools/test_verify_solution.py

      - name: MILP certificates verify in exact arithmetic, and tampered ones do not (#518)
        # Hand-written certificates for every reason the checker knows, then certificates the
        # built CLI writes for small MILPs, each checked and then tampered with.
        if: matrix.name == 'Release'
        run: python3 tools/test_verify_certificate.py

      - name: The solution report prints only numbers the .sol file holds (#527)
        if: matrix.name == 'Release'
        run: python3 tools/test_report.py

      - name: The refinery case study generates, solves, and its MILP is not its LP (#517)
        if: matrix.name == 'Release'
        run: python3 bench/case_studies/refinery/test_generator.py

      - name: An evidence bundle replays - integrity, verifier, re-solve (#526)
        if: matrix.name == 'Release'
        run: python3 tools/test_bundle.py

      - name: The Python-API walkthrough notebook runs end to end (#537)
        # Executed, not just present, so it cannot rot: notebooks/walkthrough.ipynb builds
        # demo/crude_blend.mps, solves it under two engines, verifies both independently,
        # then runs the parametric sweep (#522), the infeasibility repair (#523) and a
        # warm-started re-solve (#524) live. --stdout discards the executed copy; a raised
        # cell (an assertion or an exception) makes nbconvert exit non-zero.
        if: matrix.name == 'Release'
        run: |
          pip install nbconvert nbclient ipykernel
          python3 -m nbconvert --to notebook --execute --stdout notebooks/walkthrough.ipynb \
            > /dev/null

      - name: The Maros-Meszaros fetcher, residuals and doc section pass their tests (#491)
        # Hermetic: no download and no solve. It pins the readme parser that produces every
        # reference objective, and the residual arithmetic every QP success is judged by.
        if: matrix.name == 'Release'
        run: python3 bench/runners/test_maros_meszaros.py

      - name: The QPLIB listing parser, .qplib conversion and doc section pass their tests (#492)
        # Hermetic: no download and no solve. Excerpts of QPLIB's own pages pin the selection
        # and the reference parsing; QPLIB_0018's real file and published point pin the
        # conversion's quadratic convention through the verifier's MPS reader.
        if: matrix.name == 'Release'
        run: python3 bench/runners/test_qplib.py

      - name: The pooling instances match their published data and generator (#516)
        # Hermetic: no download and no solve. The GAMS data parser, the committed models
        # against pooling_models.py, sizes against MINLPLib, Haverly's optima as feasible
        # points of all three formulations, the pass rule and the doc section.
        if: matrix.name == 'Release'
        run: python3 bench/runners/test_pooling.py

      - name: MIPLIB seeds, primal integral and the tier-2 rule (#504)
        # Pure Python, no network, no solver: the MPS permutation leaves the model unchanged
        # (read back by the independent verifier's reader), the shifted geometric mean, the
        # primal gap and integral, the per-seed aggregation, and the tier-2 selection rule.
        if: matrix.name == 'Release'
        run: python3 bench/runners/test_miplib_seeds.py

      - name: Kennington set parsing and pass rule (#530)
        # Pure Python, no network: the readme table and its published optima, the set
        # selection, and the pass rule shared with the Netlib full-set runner.
        if: matrix.name == 'Release'
        run: python3 bench/runners/test_kennington.py

      - name: Engine-selection tree, gate and held-out split (#477)
        # Pure Python, no solver: the CART labels, determinism, the emission gate (rows,
        # distinct shapes, no shape on both sides of the split) and the committed grid.
        if: matrix.name == 'Release'
        run: python3 bench/runners/test_engine_selection_cart.py

      - name: Every results CSV is stamped with a commit on main (#433)
        # A benchmark run on a PR branch is stamped with a commit that dies at the squash
        # merge, and then scripts/reproduce.sh cannot tie the published number to a build.
        # bench/runners/check_result_stamps.py walks bench/results/*.csv and fails on any
        # stamp that is not an ancestor of main and not listed with its squash merge in
        # bench/results/squash-stamps.txt. fetch-depth: 0 above is what makes the ancestry
        # question answerable.
        if: matrix.name == 'Release'
        run: |
          python3 bench/runners/test_check_result_stamps.py
          python3 bench/runners/check_result_stamps.py --base origin/main

      # The next four steps ran on both Release and the unsplit ASan leg; `after_tests` keeps
      # them to Release and the ASan leg's third part, so each still runs exactly once per
      # build type.
      #
      # Every other check in this job is a unit test. Without this step the command line
      # itself - argument handling, file loading, the writers, the exit codes - is covered
      # by nothing and could break completely while CI stayed green. This runs the pipeline
      # the way a judge will: read a file, solve it, write the outputs, and check the number
      # against a value verified by hand outside the solver.
      - name: CLI end-to-end smoke test
        if: matrix.after_tests
        run: |
          set -euo pipefail
          ./build/sankhya version
          ./build/sankhya options
          ./build/sankhya info demo/crude_blend.mps

          echo '--- solve the MPS form ---'
          ./build/sankhya solve demo/crude_blend.mps --write-sol blend.sol --stats blend.json
          test -s blend.sol
          test -s blend.json

          echo '--- the LP form must give an identical solution ---'
          ./build/sankhya solve demo/crude_blend.lp --write-sol blend_lp.sol
          diff <(sed -n '/begin columns/,/end rows/p' blend.sol) \
               <(sed -n '/begin columns/,/end rows/p' blend_lp.sol)

          echo '--- so must the gzipped MPS ---'
          gzip -kf demo/crude_blend.mps
          ./build/sankhya solve demo/crude_blend.mps.gz --write-sol blend_gz.sol
          diff <(sed -n '/begin columns/,/end rows/p' blend.sol) \
               <(sed -n '/begin columns/,/end rows/p' blend_gz.sol)

          echo '--- --gpu must be accepted, must warn, and must give the same answer ---'
          # ENGINEERING_RULES.md: the CPU build works with zero CUDA installed and --gpu never crashes.
          # Until the CUDA backend lands this is the whole of the GPU story a judge can
          # type, so the flag has to parse and the CPU answer has to be the same one.
          ./build/sankhya solve demo/crude_blend.mps --gpu --write-sol blend_gpu.sol 2>&1 \
            | tee gpu.log
          grep -q 'no CUDA backend' gpu.log
          diff <(sed -n '/begin columns/,/end rows/p' blend.sol) \
               <(sed -n '/begin columns/,/end rows/p' blend_gpu.sol)

          echo '--- objective must match the hand-verified value ---'
          python3 tools/check_demo_result.py blend.json

          echo '--- the solution must survive INDEPENDENT verification ---'
          # verify_solution.py shares no code with the solver: it re-parses the model
          # with its own MPS reader and re-derives feasibility, the objective and
          # strong duality. A reader bug shows up here as a disagreement.
          python3 tools/verify_solution.py demo/crude_blend.mps blend.sol

          echo '--- a MILP must be SOLVED, and never answered with its relaxation ---'
          # Before Phase 5 this step asserted the MILP was refused. Branch and bound now
          # solves it, so the assertion moves to what actually matters and always did: the
          # answer must be INTEGRAL. A fractional point reported as optimal is the failure
          # this check exists to catch, whichever engine produced it.
          ./build/sankhya solve demo/blend_milp.mps --write-sol milp.sol --stats milp.json
          grep -q 'branch-and-bound' milp.json
          python3 tools/verify_solution.py demo/blend_milp.mps milp.sol
          echo 'MILP solved and independently verified'

      # The PS26119 case studies. These are the instances the demo is built on, so a
      # regression in any of them turns the demonstration into a wrong answer delivered
      # confidently to a judge. Each optimum below was established OUTSIDE the solver:
      # power_dispatch by exhaustive enumeration, lot_sizing by hand, and supply_chain and
      # ill_conditioned by the fact that the second is an exact re-scaling of the first.
      # numpy is OPTIONAL. matrix_stats.py computes rank exactly over the rationals, which
      # is the load-bearing claim and needs no third party; numpy is used only for the SVD
      # behind the condition number, and the script says so plainly when it is absent.
      - name: numpy, for the condition number only
        if: matrix.after_tests
        run: pip install numpy

      # The synthetic generator (#18). Small on purpose - this is a smoke test that the
      # generator still produces a solvable instance whose analytic optimum both engines
      # find, not a scale benchmark. 400x400 solves in under a second on both; the sizes
      # where the two engines diverge cost a minute of simplex time each and belong in a
      # benchmark run, not on every pull request.
      - name: Synthetic large LP generator
        if: matrix.after_tests
        run: |
          set -euo pipefail
          mkdir -p bench/large

          python3 bench/runners/generate_large_lp.py             --rows 400 --cols 400 --nnz-per-col 5 --seed 42 --out bench/large/ci.mps

          # The analytic optimum is read out of the instance's own header, which the
          # generator writes, rather than hard-coded here where it would rot the moment the
          # construction changed.
          expected=$(grep -oE 'analytic optimum = -?[0-9]+' bench/large/ci.mps | grep -oE -- '-?[0-9]+$')
          echo "analytic optimum from the file header: $expected"

          # Written once rather than heredoc'd inside the loop below: a heredoc in a loop
          # body is a fragile construct, and the first version of this step silently skipped
          # its second iteration - the pdhg check never ran and the step still looked like it
          # had tested both engines.
          cat > check_analytic.py <<'PYEOF'
          import json, sys
          engine, expected = sys.argv[1], float(sys.argv[2])
          blob = json.load(open(f"ci-{engine}.json"))
          status = blob["result"]["status"]
          objective = blob["result"]["objective"]
          assert status in ("optimal", "feasible"), f"{engine}: status is {status}"
          rel = abs(objective - expected) / max(1.0, abs(expected))
          assert rel <= 1e-6, (f"{engine}: objective {objective!r} vs analytic {expected!r}, "
                               f"relative error {rel:.3e}")
          print(f"{engine}: {status}, objective {objective!r} matches the analytic optimum")
          PYEOF

          for engine in simplex pdhg; do
            echo "--- $engine ---"
            # `solve` returns 0 ONLY for optimal; a limit or a feasible-but-unproven point is
            # 1, and 5 is a real error (see apps/sankhya-cli/main.cpp). PDHG legitimately
            # returns `feasible` here - it meets its relative tolerance but not the absolute
            # standard this project verifies against - so a bare invocation under `set -e`
            # aborts the loop. The first version of this step did exactly that: it passed
            # having silently never checked pdhg at all.
            code=0
            ./build/sankhya solve bench/large/ci.mps --time-limit 120               --option algorithm=$engine --option log_to_console=false               --stats "ci-$engine.json" || code=$?
            if [ "$code" -ge 5 ]; then
              echo "::error::$engine failed with exit code $code"
              exit 1
            fi
            # The status and the objective are checked properly below; the exit code only
            # distinguishes "ran" from "errored".
            python3 check_analytic.py "$engine" "$expected"
          done

      - name: PS26119 case studies
        if: matrix.after_tests
        run: |
          set -euo pipefail

          echo '--- the committed .mps files must still match their generator ---'
          # If they drift, the algebra documented in the file headers no longer describes
          # the instance the demo actually solves.
          python3 data/casestudies/generate.py
          git diff --exit-code -- data/casestudies/

          for case in power_dispatch supply_chain ill_conditioned lot_sizing; do
            echo "--- $case ---"
            ./build/sankhya solve "data/casestudies/$case.mps"               --write-sol "$case.sol" --stats "$case.json"
            python3 tools/verify_solution.py "data/casestudies/$case.mps" "$case.sol" --quiet
          done

          echo '--- the MILP answer must agree with exhaustive enumeration ---'
          # verify_solution.py cannot prove a MILP optimum is unbeatable; only a second,
          # independent search can. Four units means sixteen commitment patterns.
          python3 data/casestudies/dispatch_oracle.py
          python3 - <<'PYEOF'
          import json
          got = json.load(open("power_dispatch.json"))["result"]["objective"]
          assert abs(got - 3270.0) <= 1e-9, f"dispatch optimum moved to {got!r}, oracle says 3270"
          print("dispatch agrees with the oracle")
          PYEOF

          echo '--- scaling must not move the answer ---'
          # ill_conditioned.mps is supply_chain.mps under a diagonal change of variable
          # spanning 22 orders of magnitude. The objective is invariant under that by
          # construction, so any disagreement is a numerical bug in our solver.
          python3 - <<'PYEOF'
          import json
          a = json.load(open("supply_chain.json"))["result"]["objective"]
          b = json.load(open("ill_conditioned.json"))["result"]["objective"]
          assert abs(a - b) <= 1e-9 * max(1.0, abs(a)), f"scaling moved the answer: {a!r} vs {b!r}"
          print(f"both re-scalings agree on {a!r}")
          PYEOF

          echo '--- the robustness sweep, reduced (#71) ---'
          # One instance per point, shorter sweeps. The CSV goes outside bench/results/ so
          # a reduced run can never be mistaken for the evidence docs/BENCHMARKS.md reports.
          python3 bench/runners/robustness.py --quick --binary ./build/sankhya               --out "$RUNNER_TEMP/robustness-quick.csv"

          echo '--- every tracked shell script must be executable ---'
          # README says `scripts/reproduce.sh`, not `bash scripts/reproduce.sh`. All six
          # scripts were committed as 100644 from Windows, where git cannot see the bit,
          # and this step ran the demo through `bash`, so a Linux clone failed on the first
          # command a judge types (Permission denied, exit 126) while CI stayed green.
          git ls-files -s -- '*.sh' \
            | awk '$1 != "100755" { print "not executable: " $4; bad = 1 } END { exit bad }'
          echo 'all tracked shell scripts are executable'

          echo '--- the demo itself must run start to finish ---'
          # --quick skips the HiGHS comparison, which needs highspy. Run through the shebang,
          # not through `bash`, so the executable bit is exercised here too.
          demo/run_sih_demo.sh --quick > /dev/null
          echo 'PS26119 demo ran clean'

  benchmarks:
    name: netlib benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zlib1g-dev

      - name: Build
        run: |
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DSANKHYA_BUILD_TESTS=OFF
          cmake --build build -j

      # data/netlib/ is gitignored, so without a cache this job downloads the whole set
      # from netlib.org on every run. A netlib.org outage then turns the benchmark red for
      # a reason unrelated to the change under review - and over a sprint that trains
      # everyone to ignore a red benchmark job, which is the one job whose failure matters
      # most.
      #
      # Keyed on fetch_data.py itself, because that file decides both WHICH instances are
      # fetched (the --set tiers) and HOW the published optima are parsed out of the
      # readme. Any change to either has to re-fetch; nothing else needs to.
      - name: Cache the fetched Netlib instances
        id: netlib-cache
        uses: actions/cache@v4
        with:
          path: data/netlib
          key: netlib-v1-${{ hashFiles('bench/runners/fetch_data.py') }}

      # Downloads the instances and PARSES the reference optima out of Netlib's own
      # readme, so while netlib.org answers the benchmark cannot be made to pass by editing
      # the tracked readme or reference.json.
      #
      # --offline-fallback: when netlib.org does not answer (it timed out four times on
      # #670 and failed a PR that only added a CSV), the tracked copies in data/netlib/ -
      # every instance and the readme - are used with a warning, after a short probe.
      - name: Fetch the Netlib set and its published optima
        run: python3 bench/runners/fetch_data.py --offline-fallback

      # Gates on BOTH the published optimum and independent verification of every
      # solution. Exits non-zero if any instance fails either one.
      - name: Solve and verify
        run: python3 bench/runners/netlib.py --binary build/sankhya --time-limit 120

      - name: Upload the evidence CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netlib-results
          path: bench/results/*.csv
          if-no-files-found: warn

  netlib-medium:
    # THE GATE THAT #149 NEEDED AND DID NOT HAVE.
    #
    # The job above runs the nine committed instances and requires all nine to match their
    # published optimum. That is a strict gate on a small, easy set, and it is worth keeping
    # exactly as it is. What it cannot do is see a bug that only larger models expose.
    #
    # #149 (presolve free-column-singleton and doubleton-equation) passed all five checks and
    # regressed the DUAL on seven of the first thirty Netlib instances - objective matching
    # the published value to ten significant figures while the reduced costs were out by
    # 6.9e-01. Presolve is on by default for every model, so the blast radius was everything;
    # the job that would have caught it was pointed at nine instances that do not trigger
    # those reductions.
    #
    # This job runs the 50-instance medium tier and gates on a DIFFERENT property:
    # --require-verified fails only when the independent verifier rejects a solution, not
    # when an instance misses the published optimum. Missing an optimum can be a known
    # limitation - the tier is 43/50 and the shortfall is named in docs/BENCHMARKS.md and
    # tracked in #34 - and gating on it would paint this job permanently red, which trains
    # everyone to ignore it. A verifier rejection is never a known limitation: the verifier
    # shares no code with the solver and re-derives the answer from the original file, so its
    # rejection means the solution does not hold together on its own terms.
    name: netlib medium (verifier gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zlib1g-dev

      - name: Build
        run: |
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DSANKHYA_BUILD_TESTS=OFF
          cmake --build build -j

      # Keyed on the tier as well as on fetch_data.py, so this cache and the small set's
      # cannot overwrite each other with a different set of files under the same key.
      - name: Cache the fetched Netlib instances
        uses: actions/cache@v4
        with:
          path: data/netlib
          key: netlib-medium-v1-${{ hashFiles('bench/runners/fetch_data.py') }}

      - name: Fetch the medium tier and its published optima
        run: python3 bench/runners/fetch_data.py --set medium --offline-fallback

      - name: Solve and verify every answer
        run: |
          python3 bench/runners/netlib.py --binary build/sankhya             --time-limit 120 --require-verified

      - name: Upload the evidence CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netlib-medium-results
          path: bench/results/*.csv
          if-no-files-found: warn

  provenance:
    name: provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zlib1g-dev

      - name: Configure and build
        run: |
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DSANKHYA_BUILD_TESTS=OFF
          cmake --build build -j

      - name: Record the link line and shared library dependencies
        run: |
          echo "=== full link line ==="
          # The link command the build system actually ran. Asked of Ninja directly rather
          # than read out of a file, so it cannot drift from what was really executed.
          ninja -C build -t commands sankhya | tail -1
          echo
          echo "=== ldd build/sankhya ==="
          ldd build/sankhya
          echo
          echo "=== nothing below may name a solver ==="
          # Library names only (the first field): the load addresses on the right are hex,
          # and a run whose linux-vdso landed at 0x00007f843cbcd000 matched 'cbc' and failed
          # a PR that touched no C++ at all.
          if ldd build/sankhya | awk '{print $1}' | grep -Ei 'cbc|clp|highs|scip|soplex|glpk|lpsolve|osqp|ortools|gurobi|cplex|xpress'; then
            echo "FAIL: a solver library is linked into the binary"
            exit 1
          fi
          echo "OK: no solver library is linked"

      # The SBOM is COMMITTED, not only produced here. A bill of materials that exists solely
      # as a workflow artifact answers "what was in that CI run", which is not the question a
      # judge with a clone in front of them is asking. tools/make_sbom.py reads the pinned
      # FetchContent tags out of CMakeLists.txt and the licences out of the dependency table
      # in docs/PROVENANCE.md, so a dependency added to the build without being documented
      # fails here rather than passing silently.
      - name: SBOM is up to date with the build file
        run: python3 tools/make_sbom.py --check

      # Section 3 of PROVENANCE.md tells a judge where each algorithm lives. A row that
      # points at a file that has moved reads as a citation nobody checked; two did, for a
      # week, after scaling.cpp moved from src/pdhg/ to src/la/.
      - name: Every path PROVENANCE.md names exists
        run: python3 tools/check_provenance_paths.py

      - name: Generate SPDX SBOM from a scan, as a cross-check
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: sankhya-sbom.spdx.json

  reproduce:
    name: fresh-machine reproduction
    runs-on: ubuntu-latest
    steps:
      # THE POINT OF THIS JOB (#73). The acceptance list asks for the evidence chain to be
      # verified "on a machine that has never built this project". A hosted runner is exactly
      # that, provisioned from an image every time, and unlike a one-off check on a borrowed
      # laptop it re-verifies on every push. What it catches is the class of bug that is
      # invisible on a developer box: a path that only exists locally, a tool assumed to be
      # installed, a file committed without its executable bit (which is what happened - all
      # six scripts were mode 100644, so `scripts/reproduce.sh` died with Permission denied
      # on any clone that was not Windows).
      #
      # fetch-depth: 0 is load-bearing. bench/runners/latest_result.py orders results CSVs by
      # git history, and a depth-1 checkout has no history to order them by.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ON A PULL REQUEST, ONLY WHEN IT CAN MATTER. This job builds from scratch and runs the
      # whole evidence chain, 9 to 10 minutes, the longest job once the ASan leg was split.
      # What it catches on a pull request is a change to how a fresh machine builds and runs
      # the project: the build files, the scripts and runners a judge types, the tools they
      # call, the bindings, Python packaging, and this workflow. It also compares the pass
      # rates in docs/BENCHMARKS.md with the ones it measures, so the document, the results
      # CSVs it is generated from, the committed Netlib instances and the demo count too. A
      # pull request touching none of those (a solver change in src/, a test, a doc) skips
      # the steps below, and the push to main after the merge runs them all, as does
      # workflow_dispatch. The check is a step rather than a job-level `if` so the job still
      # ends "success" rather than "skipped" under the same name, which is what a required
      # status check would need if main's protection ever names this job.
      - name: Does this pull request touch what a fresh machine builds and runs?
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "$GITHUB_EVENT_NAME: the full reproduction always runs"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Three dots: what the branch changed since it left main, not what main has
          # gained since. If the diff cannot be taken, run everything rather than nothing.
          if ! changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA"); then
            echo "::warning::could not diff against the base; running the full reproduction"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The top-level CMakeLists.txt only: tests/CMakeLists.txt changes in most pull
          # requests, and the Release and ASan legs already configure it from nothing.
          scope='^CMakeLists\.txt$|^cmake/|^scripts/|^bench/runners/|^tools/|^third_party/'
          scope+='|^\.github/workflows/|^apps/|^bindings/|(^|/)requirements[^/]*$|(^|/)pyproject[^/]*$'
          scope+='|^demo/|^docs/BENCHMARKS\.md$|^bench/results/|^data/netlib/'
          hits=$(printf '%s\n' "$changed" | grep -E "$scope" || true)
          if [ -n "$hits" ]; then
            echo "the full reproduction runs, because this pull request changes:"
            printf '%s\n' "$hits" | sed 's/^/  /'
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::fresh-machine reproduction not needed: nothing this pull request changes is in its scope; it runs on the push to main"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install what a judge would install
        if: steps.scope.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          # numpy and highspy are what separate a complete run from a DEGRADED one: without
          # them reproduce.sh skips the conditioning sweep's SVD and the HiGHS comparison,
          # and this job asserts below that nothing was skipped.
          pip install numpy highspy

      # No arguments: the offline path, the one a judge on conference wifi gets. The nine
      # committed Netlib instances make that possible, and --fetch-medium is deliberately not
      # passed so this job does not depend on netlib.org being up.
      - name: scripts/reproduce.sh, from a clone that has never been built
        if: steps.scope.outputs.run == 'true'
        run: |
          set -o pipefail
          scripts/reproduce.sh 2>&1 | tee "$RUNNER_TEMP/reproduce.log"

      # The script prints what it could not run rather than failing, because a reader is
      # better served by partial evidence than by a stack trace. That makes its exit code the
      # wrong thing to gate on: the assertion that matters is that the list of skips is empty.
      - name: Nothing may have been skipped
        if: steps.scope.outputs.run == 'true'
        run: |
          if grep -q 'Nothing was skipped' "$RUNNER_TEMP/reproduce.log"; then
            echo "the whole evidence chain ran on a machine that had never built it"
          else
            echo "FAIL: reproduce.sh skipped at least one step on a fresh machine:"
            sed -n '/step(s) skipped/,$p' "$RUNNER_TEMP/reproduce.log"
            exit 1
          fi

      # docs/BENCHMARKS.md is regenerated by the run above and WILL differ, because the
      # timings are this runner's. The COUNTS must not: every "**N of M**" in the document is
      # a pass rate or a proof rate, and one of those moving means the committed document
      # claims something this machine did not measure. Comparing the counts rather than
      # filtering the diff keeps this from failing on an unrelated wording change.
      - name: The regenerated document may differ only in timings
        if: steps.scope.outputs.run == 'true'
        run: |
          # Scratch files go to RUNNER_TEMP, never the workspace: a later step diffs the
          # tree, and a stray file there is noise at best and a false signal at worst.
          git diff -- docs/BENCHMARKS.md > "$RUNNER_TEMP/benchmarks.diff" || true
          git show HEAD:docs/BENCHMARKS.md > "$RUNNER_TEMP/committed.md"
          python3 - <<'PY'
          import re, sys
          import os
          counts = lambda p: re.findall(r"\*\*(\d+) of (\d+)\*\*", open(p, encoding="utf-8").read())
          tmp = os.environ["RUNNER_TEMP"]
          before, after = counts(f"{tmp}/committed.md"), counts("docs/BENCHMARKS.md")
          if before == after:
              print(f"{len(after)} counts unchanged; only timings moved")
              sys.exit(0)
          print("FAIL: a pass or proof rate moved on this machine")
          print(f"  committed:   {before}")
          print(f"  regenerated: {after}")
          sys.exit(1)
          PY

      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.run == 'true'
        with:
          name: fresh-machine-reproduction
          path: |
            ${{ runner.temp }}/reproduce.log
            ${{ runner.temp }}/benchmarks.diff

  cuda-build:
    # Proves that the CUDA translation unit compiles and links with SANKHYA_ENABLE_CUDA=ON.
    # GitHub's free runners have no GPU, so this job builds only — it never runs kernels.
    # The CPU-only jobs above are the authoritative correctness gate; this job is the
    # authoritative "the CUDA code compiles" gate.
    name: CUDA build (compile only, no GPU runner)
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.6.0-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # security.ubuntu.com has served an index ahead of its pool (a 404 on
          # libexpat1_2.4.7-1ubuntu0.9 on 24 Sep 2026); archive.ubuntu.com carries the same
          # -security pocket. A few retries ride out a mirror mid-sync.
          sed -i 's|http://security.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list
          for attempt in 1 2 3; do
            apt-get update && apt-get install -y ninja-build cmake g++ zlib1g-dev git && break
            [ "$attempt" = 3 ] && exit 1
            sleep 30
          done

      - name: Configure with CUDA enabled
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSANKHYA_ENABLE_CUDA=ON \
            -DSANKHYA_BUILD_TESTS=OFF \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc

      - name: Build
        run: cmake --build build -j

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned via pip rather than apt: clang-format's output changes between major versions,
      # so an unpinned formatter turns a green tree red on an unrelated runner image bump.
      # This is the exact version the tree was normalised with.
      - name: Check formatting
        run: |
          pip install clang-format==22.1.8
          clang-format --version
          find include src apps tests -type f \( -name '*.hpp' -o -name '*.cpp' -o -name '*.h' \) \
            -print0 | xargs -0 clang-format --dry-run --Werror
